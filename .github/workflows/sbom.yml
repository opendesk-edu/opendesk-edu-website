name: Generate SBOM

on:
  workflow_dispatch:
    inputs:
      format:
        description: 'SBOM Format'
        required: true
        default: 'both'
        type: choice
        options:
          - cyclonedx
          - spdx
          - both
      output-dir:
        description: 'Output Directory'
        required: false
        default: 'sbom-output'

jobs:
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create output directory
        run: mkdir -p ${{ inputs.output-dir }}

      - name: Generate SBOM for Website (Node.js/Next.js)
        run: |
          echo "🚀 Generating SBOM for openDesk Edu Website..."
          
          # CycloneDX
          if [ "${{ inputs.format }}" = "cyclonedx" ] || [ "${{ inputs.format }}" = "both" ]; then
            echo "📋 Generating CycloneDX SBOM..."
            npx @cyclonedx/cyclonedx-npm@latest -o ${{ inputs.output-dir }}/sbom-website-cyclonedx.json
            echo "✅ CycloneDX SBOM generated"
          fi
          
          # SPDX
          if [ "${{ inputs.format }}" = "spdx" ] || [ "${{ inputs.format }}" = "both" ]; then
            echo "📋 Generating SPDX SBOM..."
            npm install -g spdx-npm
            spdx-npm -o ${{ inputs.output-dir }}/sbom-website-spdx.json
            echo "✅ SPDX SBOM generated"
          fi

      - name: Validate SBOMs
        run: |
          echo "🔍 Validating generated SBOMs..."
          
          # Install validation tools
          npm install -g @cyclonedx/cyclonedx-validator
          
          if [ -f "${{ inputs.output-dir }}/sbom-website-cyclonedx.json" ]; then
            echo "Validating CycloneDX SBOM..."
            cyclonedx-validator ${{ inputs.output-dir }}/sbom-website-cyclonedx.json || true
          fi
          
          echo "✅ Validation complete"

      - name: Generate Summary
        run: |
          echo "📊 SBOM Generation Summary" > ${{ inputs.output-dir }}/SBOM_SUMMARY.md
          echo "========================" >> ${{ inputs.output-dir }}/SBOM_SUMMARY.md
          echo "" >> ${{ inputs.output-dir }}/SBOM_SUMMARY.md
          echo "Generated on: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> ${{ inputs.output-dir }}/SBOM_SUMMARY.md
          echo "Component: openDesk Edu Website (Next.js)" >> ${{ inputs.output-dir }}/SBOM_SUMMARY.md
          echo "" >> ${{ inputs.output-dir }}/SBOM_SUMMARY.md
          echo "Format(s): ${{ inputs.format }}" >> ${{ inputs.output-dir }}/SBOM_SUMMARY.md
          echo "" >> ${{ inputs.output-dir }}/SBOM_SUMMARY.md
          
          if [ "${{ inputs.format }}" = "cyclonedx" ] || [ "${{ inputs.format }}" = "both" ]; then
            SIZE=$(stat -f%z ${{ inputs.output-dir }}/sbom-website-cyclonedx.json 2>/dev/null || stat -c%s ${{ inputs.output-dir }}/sbom-website-cyclonedx.json 2>/dev/null || echo "unknown")
            echo "- CycloneDX: sbom-website-cyclonedx.json (${SIZE} bytes)" >> ${{ inputs.output-dir }}/SBOM_SUMMARY.md
          fi
          
          if [ "${{ inputs.format }}" = "spdx" ] || [ "${{ inputs.format }}" = "both" ]; then
            SIZE=$(stat -f%z ${{ inputs.output-dir }}/sbom-website-spdx.json 2>/dev/null || stat -c%s ${{ inputs.output-dir }}/sbom-website-spdx.json 2>/dev/null || echo "unknown")
            echo "- SPDX: sbom-website-spdx.json (${SIZE} bytes)" >> ${{ inputs.output-dir }}/SBOM_SUMMARY.md
          fi
          
          echo "" >> ${{ inputs.output-dir }}/SBOM_SUMMARY.md
          echo "Tools used:" >> ${{ inputs.output-dir }}/SBOM_SUMMARY.md
          echo "- @cyclonedx/cyclonedx-npm" >> ${{ inputs.output-dir }}/SBOM_SUMMARY.md
          echo "- spdx-npm" >> ${{ inputs.output-dir }}/SBOM_SUMMARY.md
          echo "- @cyclonedx/cyclonedx-validator" >> ${{ inputs.output-dir }}/SBOM_SUMMARY.md
          
          cat ${{ inputs.output-dir }}/SBOM_SUMMARY.md

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-website-${{ inputs.format }}-${{ github.sha }}
          path: ${{ inputs.output-dir }}/
          retention-days: 90

  sign-sbom:
    name: Sign SBOMs (Optional)
    needs: generate-sbom
    runs-on: ubuntu-latest
    if: success() && false # Disabled by default; enable when cosign is configured
    
    steps:
      - name: Download SBOM Artifacts
        uses: actions/download-artifact@v4
        with:
          name: sbom-website-${{ inputs.format }}-${{ github.sha }}
          path: sbom-output

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign SBOMs
        run: |
          for file in sbom-output/sbom-*.json; do
            if [ -f "$file" ]; then
              echo "Signing $file..."
              cosign sign-blob --yes "$file" \
                --output-signature "$file.sig" \
                --output-certificate "$file.cert" || true
            fi
          done

      - name: Upload Signed SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-website-signed-${{ github.sha }}
          path: sbom-output/
          retention-days: 90
