name: Deploy to Production

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/audit.yml'
      - '.github/workflows/coverage.yml'
      - 'LICENSE'
      - 'README.md'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force deployment even if CI fails'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: [self-hosted, linux]
    outputs:
      should_deploy: ${{ steps.validation.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Verify this is the main branch
      - name: Check branch
        id: branch-check
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Not main branch, skipping"
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "should_deploy=true" >> $GITHUB_OUTPUT

      # Check if there are actual changes that affect production
      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          base: HEAD~1
          filters: |
            production:
              - 'src/**'
              - 'components/**'
              - 'content/**'
              - 'public/**'
              - 'messages/**'
              - 'next.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'

      - name: Set deploy flag
        id: validation
        run: |
          if [ "${{ steps.branch-check.outputs.should_deploy }}" = "true" ] && \
             ([ "${{ steps.changes.outputs.production }}" = "true" ] || \
              [ "${{ github.event_name }}" = "workflow_dispatch" ]); then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "Skipping deployment - no production changes or not triggered manually"
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

  test:
    name: Test
    needs: validate
    if: needs.validate.outputs.should_deploy == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test:ci

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy
    needs: [validate, test]
    if: |
      needs.validate.outputs.should_deploy == 'true' && 
      (needs.test.result == 'success' || github.event.inputs.force == 'true')
    runs-on: [self-hosted, linux]
    environment:
      name: production
      url: https://opendesk-edu.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for Production
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build
        run: |
          if [ ! -d "out" ]; then
            echo "Build output directory not found!"
            exit 1
          fi
          ls -la out/

      # Analyze which files changed for cache invalidation
      - name: Detect content changes
        id: content-changes
        run: |
          # Get changed files in content and public directories
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || echo "")
          
          if echo "$CHANGED_FILES" | grep -qE "^content/|^public/"; then
            echo "content_changed=true" >> $GITHUB_OUTPUT
          else
            echo "content_changed=false" >> $GITHUB_OUTPUT
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"

      # SSH to production server and deploy
      - name: Deploy to opendesk-edu.org (178.254.2.90)
        uses: appleboy/ssh-action@v1
        with:
          host: 178.254.2.90
          username: weiss
          key: ${{ secrets.SSH_PRIVATE_KEY_OPENCODE_DE }}
          port: 22
          script_stop: true
          script: |
            set -e
            
            echo "🚀 Starting deployment to opendesk-edu.org"
            
            # Deployment directory
            DEPLOY_DIR="/home/weiss/opendesk-edu-website"
            BACKUP_DIR="/home/weiss/opendesk-edu-backups"
            TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
            
            # Create backup
            echo "📦 Creating backup..."
            mkdir -p "$BACKUP_DIR"
            if [ -d "$DEPLOY_DIR" ]; then
              tar -czf "$BACKUP_DIR/opendesk-edu_$TIMESTAMP.tar.gz" -C "$DEPLOY_DIR" . 
              echo "✅ Backup created: $BACKUP_DIR/opendesk-edu_$TIMESTAMP.tar.gz"
            fi
            
            # Keep only last 5 backups
            cd "$BACKUP_DIR" && ls -t opendesk-edu_*.tar.gz | tail -n +6 | xargs rm -f 2>/dev/null || true
            
            # Remove old deployment (except .env and .htpasswd)
            echo "🧹 Cleaning old deployment..."
            if [ -d "$DEPLOY_DIR" ]; then
              cd "$DEPLOY_DIR"
              # Save important files
              mkdir -p /tmp/opendesk-save
              [ -f .env ] && cp .env /tmp/opendesk-save/
              [ -f .htpasswd ] && cp .htpasswd /tmp/opendesk-save/
              [ -f package.json ] && cp package.json /tmp/opendesk-save/
              [ -d node_modules ] && mv node_modules /tmp/opendesk-save/
              
              # Remove everything else
              rm -rf * .* 2>/dev/null || true
              
              # Restore saved files
              [ -f /tmp/opendesk-save/.env ] && cp /tmp/opendesk-save/.env .
              [ -f /tmp/opendesk-save/.htpasswd ] && cp /tmp/opendesk-save/.htpasswd .
              [ -d /tmp/opendesk-save/node_modules ] && mv /tmp/opendesk-save/node_modules .
              rm -rf /tmp/opendesk-save
            else
              mkdir -p "$DEPLOY_DIR"
            fi
            
            echo "✅ Old deployment cleaned"

      # Upload built files
      - name: Upload built files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: 178.254.2.90
          username: weiss
          key: ${{ secrets.SSH_PRIVATE_KEY_OPENCODE_DE }}
          port: 22
          source: "out/,package.json,next.config.ts,public/"
          target: /home/weiss/opendesk-edu-website

      # Finalize deployment on server
      - name: Finalize deployment
        uses: appleboy/ssh-action@v1
        with:
          host: 178.254.2.90
          username: weiss
          key: ${{ secrets.SSH_PRIVATE_KEY_OPENCODE_DE }}
          port: 22
          script: |
            set -e
            
            DEPLOY_DIR="/home/weiss/opendesk-edu-website"
            cd "$DEPLOY_DIR"
            
            echo "📦 Finalizing deployment..."
            
            # Ensure package.json exists
            if [ ! -f package.json ]; then
              echo "❌ package.json not found!"
              exit 1
            fi
            
            # Install dependencies if node_modules missing
            if [ ! -d node_modules ]; then
              echo "📦 Installing dependencies..."
              npm install --production --prefer-offline --no-audit
            fi
            
            # Restart PM2 service
            echo "🔄 Restarting Next.js service..."
            if command -v pm2 >/dev/null 2>&1; then
              # Check if service exists
              if pm2 list | grep -q "opendesk-edu-website"; then
                pm2 restart opendesk-edu-website
              else
                pm2 start npm --name "opendesk-edu-website" -- start
              fi
              pm2 save
              pm2 list
            else
              # Use systemd if available
              if [ -f /etc/systemd/system/opendesk-edu-website.service ]; then
                sudo systemctl restart opendesk-edu-website
                sudo systemctl status opendesk-edu-website --no-pager
              else
                # Fallback: start with nohup
                nohup npm run start > /var/log/opendesk-edu-website.log 2>&1 &
                echo "Started with nohup, PID: $!"
                echo "Logs: /var/log/opendesk-edu-website.log"
              fi
            fi
            
            echo "✅ Deployment finalized"
            
            # Verify deployment
            sleep 5
            echo "🧪 Verifying deployment..."
            curl -sSf http://localhost:3000 > /dev/null && echo "✅ Local health check passed" || echo "⚠️  Local health check failed"
            curl -sSf https://opendesk-edu.org > /dev/null && echo "✅ Production URL accessible" || echo "⚠️  Production URL not accessible"

      - name: Check ZKI article
        uses: appleboy/ssh-action@v1
        with:
          host: 178.254.2.90
          username: weiss
          key: ${{ secrets.SSH_PRIVATE_KEY_OPENCODE_DE }}
          port: 22
          script: |
            echo "🔍 Checking if ZKI article is live..."
            curl -sSf https://opendesk-edu.org/de/blog/zki-it-grundschutz-compliance | grep -q "ZKI IT-Grundschutz" && \
              echo "✅ ZKI article is LIVE!" || \
              echo "❌ ZKI article not found - manual check required"
            
            # Also check all locales
            for locale in en de fr zh; do
              URL="https://opendesk-edu.org/$locale/blog/zki-it-grundschutz-compliance"
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
              if [ "$STATUS" = "200" ]; then
                echo "✅ $locale article: OK (200)"
              else
                echo "⚠️  $locale article: $STATUS"
              fi
            done

      # Notify Slack (optional - will fail gracefully if not configured)
      - name: Notify Slack
        if: success()
        uses: rtCamp/action-slack-notify@v2
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: good
          SLACK_TITLE: "opendesk-edu.org deployed"
          SLACK_MESSAGE: "Production deployment completed successfully :rocket:"
          SLACK_FOOTER: "Commit: ${{ github.sha }}"
