name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/audit.yml'
      - '.github/workflows/coverage.yml'
      - 'LICENSE'
      - 'README.md'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target (staging or live)'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - live
      force:
        description: 'Force deployment even if CI fails'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: [self-hosted, linux]
    outputs:
      should_deploy: ${{ steps.validation.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch
        id: branch-check
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Not main branch, skipping"
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "should_deploy=true" >> $GITHUB_OUTPUT

      - name: Set deploy flag
        id: validation
        run: |
          if [ "${{ steps.branch-check.outputs.should_deploy }}" = "true" ] || \
             [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

  test:
    name: Test
    needs: validate
    if: needs.validate.outputs.should_deploy == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy-staging:
    name: Deploy to Staging
    needs: [validate, test]
    if: |
      needs.validate.outputs.should_deploy == 'true' &&
      (needs.test.result == 'success' || github.event.inputs.force == 'true')
    runs-on: [self-hosted, linux]
    environment:
      name: staging
      url: https://staging.opendesk-edu.org
    steps:
      - name: Deploy to staging.opendesk-edu.org via SSH
        env:
          DEPLOY_HOST: 178.254.2.90
          DEPLOY_USER: weiss
          DEPLOY_DIR: /opt/git/opendesk-edu-website
        run: |
          set -e

          echo "🚀 Starting deployment to staging.opendesk-edu.org"
          echo "Runner: $(hostname)"

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s" << 'REMOTE_SCRIPT'
          set -e

          DEPLOY_DIR="/opt/git/opendesk-edu-website"
          echo "📦 Deploy directory: ${DEPLOY_DIR}"
          cd "${DEPLOY_DIR}"

          # Pull latest code
          echo "📥 Pulling latest code..."
          git fetch origin main
          git reset --hard origin/main

          # Build and deploy staging with Docker Compose
          echo "🔨 Building staging Docker image..."
          DOCKER_BUILDKIT=1 docker compose -f docker-compose.staging.yml build

          echo "🔄 Starting staging container..."
          docker compose -f docker-compose.staging.yml up -d

          # Wait for container to be healthy
          echo "⏳ Waiting for staging container to start..."
          sleep 15

          # Verify staging deployment
          echo "🧪 Verifying staging deployment..."
          if curl -sSf http://localhost:3000 > /dev/null 2>&1; then
            echo "✅ Local health check passed"
          else
            echo "⚠️  Local health check failed (container may still be starting)"
          fi

          if curl -sSf https://staging.opendesk-edu.org > /dev/null 2>&1; then
            echo "✅ Staging URL accessible"
          else
            echo "⚠️  Staging URL not accessible (TLS cert may still be provisioning)"
          fi

          echo "✅ Staging deployment finalized"
          REMOTE_SCRIPT

      - name: Notify Slack (optional)
        if: success()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            curl -s -X POST -H 'Content-type: application/json' \
              --data '{"text":"staging.opendesk-edu.org deployed :rocket"}' \
              "${{ secrets.SLACK_WEBHOOK }}" || echo "Slack notification failed (non-blocking)"
          else
            echo "SLACK_WEBHOOK not configured, skipping notification"
          fi

  deploy-live:
    name: Promote to Live
    needs: [validate, test, deploy-staging]
    if: |
      needs.validate.outputs.should_deploy == 'true' &&
      needs.deploy-staging.result == 'success' &&
      github.event.inputs.target == 'live'
    runs-on: [self-hosted, linux]
    environment:
      name: production
      url: https://opendesk-edu.org
    steps:
      - name: Deploy to opendesk-edu.org via SSH
        env:
          DEPLOY_HOST: 178.254.2.90
          DEPLOY_USER: weiss
          DEPLOY_DIR: /opt/git/opendesk-edu-website
        run: |
          set -e

          echo "🚀 Promoting to opendesk-edu.org (live)"
          echo "Runner: $(hostname)"

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s" << 'REMOTE_SCRIPT'
          set -e

          DEPLOY_DIR="/opt/git/opendesk-edu-website"
          echo "📦 Deploy directory: ${DEPLOY_DIR}"
          cd "${DEPLOY_DIR}"

          # Pull latest code (already pulled by staging, but ensure consistency)
          echo "📥 Pulling latest code..."
          git fetch origin main
          git reset --hard origin/main

          # Build and deploy live with Docker Compose
          echo "🔨 Building live Docker image..."
          DOCKER_BUILDKIT=1 docker compose -f docker-compose.yml build

          echo "🔄 Restarting live container..."
          docker compose -f docker-compose.yml up -d

          # Wait for container to be healthy
          echo "⏳ Waiting for live container to start..."
          sleep 15

          # Verify live deployment
          echo "🧪 Verifying live deployment..."
          if curl -sSf http://localhost:3000 > /dev/null 2>&1; then
            echo "✅ Local health check passed"
          else
            echo "⚠️  Local health check failed (container may still be starting)"
          fi

          if curl -sSf https://opendesk-edu.org > /dev/null 2>&1; then
            echo "✅ Production URL accessible"
          else
            echo "⚠️  Production URL not accessible"
          fi

          # Check article availability
          for locale in en de fr zh; do
            URL="https://opendesk-edu.org/$locale/blog/la-suite-vs-opendesk-edu"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ $locale article (La Suite vs. openDesk Edu): OK (200)"
            else
              echo "⚠️  $locale article (La Suite vs. openDesk Edu): $STATUS"
            fi
          done

          echo "✅ Live deployment finalized"
          REMOTE_SCRIPT

      - name: Notify Slack (optional)
        if: success()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            curl -s -X POST -H 'Content-type: application/json' \
              --data '{"text":"opendesk-edu.org promoted to live :rocket"}' \
              "${{ secrets.SLACK_WEBHOOK }}" || echo "Slack notification failed (non-blocking)"
          else
            echo "SLACK_WEBHOOK not configured, skipping notification"
          fi
