name: Deploy to Production

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/audit.yml'
      - '.github/workflows/coverage.yml'
      - 'LICENSE'
      - 'README.md'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force deployment even if CI fails'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: [self-hosted, linux]
    outputs:
      should_deploy: ${{ steps.validation.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch
        id: branch-check
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Not main branch, skipping"
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "should_deploy=true" >> $GITHUB_OUTPUT

      - name: Set deploy flag
        id: validation
        run: |
          if [ "${{ steps.branch-check.outputs.should_deploy }}" = "true" ] || \
             [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

  test:
    name: Test
    needs: validate
    if: needs.validate.outputs.should_deploy == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy
    needs: [validate, test]
    if: |
      needs.validate.outputs.should_deploy == 'true' && 
      (needs.test.result == 'success' || github.event.inputs.force == 'true')
    runs-on: [self-hosted, linux]
    environment:
      name: production
      url: https://opendesk-edu.org
    steps:
      - name: Deploy to opendesk-edu.org via Docker Compose
        uses: appleboy/ssh-action@v1
        with:
          host: 178.254.2.90
          username: weiss
          key: ${{ secrets.SSH_PRIVATE_KEY_OPENCODE_DE }}
          port: 22
          script_stop: true
          script: |
            set -e

            echo "🚀 Starting deployment to opendesk-edu.org"

            DEPLOY_DIR="/home/weiss/opendesk-edu-website"

            cd "$DEPLOY_DIR"

            # Pull latest code
            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # Build and deploy with Docker Compose
            echo "🔨 Building Docker image..."
            if command -v docker buildx >/dev/null 2>&1; then
              DOCKER_BUILDKIT=1 docker compose build
            elif docker version | grep -q "BuildKit"; then
              DOCKER_BUILDKIT=1 docker compose build
            else
              docker compose build
            fi

            echo "🔄 Restarting container..."
            docker compose up -d

            # Wait for container to be healthy
            echo "⏳ Waiting for container to start..."
            sleep 10

            # Verify deployment
            echo "🧪 Verifying deployment..."
            if curl -sSf http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Local health check passed"
            else
              echo "⚠️  Local health check failed (container may still be starting)"
            fi

            if curl -sSf https://opendesk-edu.org > /dev/null 2>&1; then
              echo "✅ Production URL accessible"
            else
              echo "⚠️  Production URL not accessible"
            fi

            # Check article availability
            for locale in en de fr zh; do
              URL="https://opendesk-edu.org/$locale/blog/la-suite-vs-opendesk-edu"
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ $locale article (La Suite vs. openDesk Edu): OK (200)"
              else
                echo "⚠️  $locale article (La Suite vs. openDesk Edu): $STATUS"
              fi
            done

            for locale in en de fr zh; do
              URL="https://opendesk-edu.org/$locale/blog/zki-it-grundschutz-compliance"
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ $locale article (ZKI compliance): OK (200)"
              else
                echo "⚠️  $locale article (ZKI compliance): $STATUS"
              fi
            done

            echo "✅ Deployment finalized"

      - name: Notify Slack (optional)
        if: success() && env.SLACK_WEBHOOK != ''
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            curl -s -X POST -H 'Content-type: application/json' \
              --data '{"text":"opendesk-edu.org deployed successfully :rocket"}' \
              "${{ secrets.SLACK_WEBHOOK }}" || true
          else
            echo "SLACK_WEBHOOK not configured, skipping notification"
          fi
