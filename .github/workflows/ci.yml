name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Security Checks
  security:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # Content Validation
  validate:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate:content
      - run: npm run check:integration
      - run: npm run check:env

  # Code Quality
  lint:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # Unit Tests
  test:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            test-results/
            coverage/
          retention-days: 7

  # E2E Tests
  e2e:
    runs-on: [self-hosted, linux]
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - name: Upload E2E results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Build
  build:
    runs-on: [self-hosted, linux]
    needs: [lint, test, e2e, validate, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 7

  # Production Deployment (main)
  deploy:
    runs-on: [self-hosted, linux]
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Write SSH key
        run: |
          mkdir -p "${HOME}/.ssh"
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"
          ssh-keyscan ${{ secrets.DEPLOY_HOST }} >> "${HOME}/.ssh/known_hosts" 2>/dev/null

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull
            export COMMIT_SHA=$(git rev-parse --short HEAD)
            export IMAGE_TAG="opendesk-edu:${COMMIT_SHA}"
            # Check BuildKit availability and fallback
            if command -v docker buildx >/dev/null 2>&1; then
              DOCKER_BUILDKIT=1 docker compose build
            elif docker version | grep -q "BuildKit"; then
              DOCKER_BUILDKIT=1 docker compose build
            else
              docker compose build
            fi
            docker tag opendesk-edu:latest ${IMAGE_TAG} 2>/dev/null || true
            docker compose up -d

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 30 https://opendesk-edu.org) || true
            if [ "$STATUS" = "200" ]; then
              echo "✅ Site is live (HTTP 200)"
              exit 0
            elif [ "$i" -lt 6 ]; then
              echo "⚠️  Attempt $i/6: Site returned HTTP $STATUS, retrying in 5s..."
              sleep 5
            else
              echo "❌ Site verification failed after 6 attempts (HTTP $STATUS)"
              exit 1
            fi
          done
