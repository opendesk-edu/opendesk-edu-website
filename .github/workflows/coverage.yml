name: Test Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test -- --coverage

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: unit-tests
          fail_ci_if_error: false

      - name: Check coverage threshold
        run: |
          echo "📊 Coverage Report:"
          # Run tests with coverage and capture output
          npm run test -- --coverage 2>&1 | tee coverage-output.txt
          
          # Extract coverage percentages from console output
          STATEMENTS=$(grep -oP 'Statements\s+:\s+\K[0-9.]+' coverage-output.txt)
          BRANCHES=$(grep -oP 'Branches\s+:\s+\K[0-9.]+' coverage-output.txt)
          FUNCTIONS=$(grep -oP 'Functions\s+:\s+\K[0-9.]+' coverage-output.txt)
          LINES=$(grep -oP 'Lines\s+:\s+\K[0-9.]+' coverage-output.txt)
          
          echo ""
          echo "   Statements: ${STATEMENTS}%"
          echo "   Branches: ${BRANCHES}%"
          echo "   Functions: ${FUNCTIONS}%"
          echo "   Lines: ${LINES}%"
          
          # Check if coverage meets minimum threshold
          MIN_COVERAGE=75
          if (( $(echo "$LINES < $MIN_COVERAGE" | bc -l) )); then
            echo "⚠️  Coverage below threshold (${LINES}% < ${MIN_COVERAGE}%)" >&2
            exit 1
          else
            echo "✅ Coverage meets threshold (${LINES}% >= ${MIN_COVERAGE}%)"
          fi
        id: coverage-check

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: |
            coverage/
            coverage-summary.json
          retention-days: 7
