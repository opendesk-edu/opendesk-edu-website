name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: GitLeaks (Disabled - GHCR auth required)
    runs-on: [self-hosted, linux]
    steps:
      - name: Skipped - GitLeaks action requires GHCR authentication
        run: echo "GitLeaks scan disabled: Docker action requires GHCR authentication"

  trufflehog:
    name: TruffleHog (Disabled - GHCR auth required)
    runs-on: [self-hosted, linux]
    steps:
      - name: Skipped - TruffleHog action requires GHCR authentication
        run: echo "TruffleHog scan disabled: Docker action requires GHCR authentication"
