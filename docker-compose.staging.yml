services:
  opendesk-edu-staging:
    build:
      context: .
      dockerfile: Dockerfile
    image: opendesk-edu:staging
    container_name: opendesk-edu-staging
    restart: unless-stopped
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      # HTTP redirect to HTTPS (excludes ACME challenge path so Let's Encrypt works)
      - "traefik.http.routers.opendesk-edu-staging.rule=Host(`staging.opendesk-edu.org`) && !PathPrefix(`/.well-known/acme-challenge/`)"
      - traefik.http.routers.opendesk-edu-staging.entrypoints=web
      - traefik.http.routers.opendesk-edu-staging.middlewares=https-redirect@file
      - "traefik.http.routers.opendesk-edu-staging-secure.rule=Host(`staging.opendesk-edu.org`)"
      - traefik.http.routers.opendesk-edu-staging-secure.entrypoints=websecure
      - traefik.http.routers.opendesk-edu-staging-secure.tls=true
      - traefik.http.routers.opendesk-edu-staging-secure.tls.certresolver=mytlschallenge
      - traefik.http.routers.opendesk-edu-staging-secure.middlewares=security-headers@file,compression@file
      - traefik.http.services.opendesk-edu-staging.loadbalancer.server.port=3000
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
    name: traefik-public
