<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>openDesk Edu — Storage &amp; Data Management Architecture</title>
  <desc>Branded teaser image for the openDesk Edu Storage and Data Management Architecture article. Dark purple gradient background with a storage/database icon, grid pattern, and article title.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="50%" stop-color="#0d0020"/>
      <stop offset="100%" stop-color="#0a0014"/>
    </linearGradient>
    <linearGradient id="storageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#571EFA"/>
      <stop offset="100%" stop-color="#927AFA"/>
    </linearGradient>
    <linearGradient id="accentLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#571EFA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#571EFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#927AFA" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#927AFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#571EFA"/>
      <stop offset="100%" stop-color="#927AFA"/>
    </linearGradient>
    <filter id="glowWide" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#571EFA" stroke-width="0.5" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left accent glow -->
  <ellipse cx="200" cy="315" rx="300" ry="400" fill="url(#accentLeft)"/>
  <!-- Right accent glow -->
  <ellipse cx="1000" cy="315" rx="300" ry="400" fill="url(#accentRight)"/>

  <!-- Storage/database icon: stacked cylinders + backup arrow -->
  <g transform="translate(190, 195)">
    <!-- Glow behind icon -->
    <circle cx="100" cy="120" r="90" fill="url(#iconGrad)" opacity="0.15" filter="url(#glowWide)"/>

    <!-- Database cylinder stack (3 layers) -->
    <g stroke="url(#storageGrad)" stroke-width="2.5" fill="none">
      <!-- Top cylinder -->
      <ellipse cx="100" cy="45" rx="45" ry="14" fill="url(#storageGrad)" opacity="0.3"/>
      <path d="M 55 45 L 55 75 Q 55 89 100 89 Q 145 89 145 75 L 145 45" fill="url(#storageGrad)" opacity="0.15"/>
      <line x1="55" y1="45" x2="55" y2="75"/>
      <line x1="145" y1="45" x2="145" y2="75"/>

      <!-- Middle cylinder -->
      <ellipse cx="100" cy="100" rx="45" ry="14" fill="url(#storageGrad)" opacity="0.3"/>
      <path d="M 55 100 L 55 130 Q 55 144 100 144 Q 145 144 145 130 L 145 100" fill="url(#storageGrad)" opacity="0.15"/>
      <line x1="55" y1="100" x2="55" y2="130"/>
      <line x1="145" y1="100" x2="145" y2="130"/>

      <!-- Bottom cylinder -->
      <ellipse cx="100" cy="155" rx="45" ry="14" fill="url(#storageGrad)" opacity="0.3"/>
      <path d="M 55 155 L 55 185 Q 55 199 100 199 Q 145 199 145 185 L 145 155" fill="url(#storageGrad)" opacity="0.15"/>
      <line x1="55" y1="155" x2="55" y2="185"/>
      <line x1="145" y1="155" x2="145" y2="185"/>
    </g>

    <!-- Backup arrow (circular) -->
    <g stroke="url(#storageGrad)" stroke-width="2" fill="none" opacity="0.8">
      <path d="M 30 210 Q 100 230 170 210" stroke-dasharray="4 3"/>
      <polygon points="165,205 175,210 165,215" fill="url(#storageGrad)" opacity="0.8"/>
    </g>
  </g>

  <!-- Title text -->
  <text x="580" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#ffffff" text-anchor="start" letter-spacing="-0.5">
    Storage &amp; Data
  </text>
  <text x="580" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="url(#storageGrad)" text-anchor="start" letter-spacing="-0.5">
    Management Architecture
  </text>

  <!-- Subtitle -->
  <text x="580" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#a0a0c0" text-anchor="start">
    Persistent Volumes · Databases · Backup · Lifecycle
  </text>

  <!-- Bottom accent line -->
  <rect x="580" y="390" width="340" height="3" rx="1.5" fill="url(#storageGrad)" opacity="0.6"/>

  <!-- openDesk Edu branding -->
  <text x="580" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#666680" text-anchor="start">
    openDesk Edu · Architecture Reference
  </text>
</svg>
