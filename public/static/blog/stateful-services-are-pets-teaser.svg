<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>openDesk Edu - Stateful Services Are Pets</title><desc>Branded teaser image for the openDesk Edu stateful services article featuring a dark purple gradient background, a heart-and-database shield icon, grid pattern, and article title.</desc><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0014"/><stop offset="50%" stop-color="#0d0020"/><stop offset="100%" stop-color="#0a0014"/></linearGradient><linearGradient id="accentLeft" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#571EFA" stop-opacity="0.3"/><stop offset="100%" stop-color="#571EFA" stop-opacity="0"/></linearGradient><linearGradient id="accentRight" x1="100%" x2="0%" y1="0%" y2="0%"><stop offset="0%" stop-color="#927AFA" stop-opacity="0.2"/><stop offset="100%" stop-color="#927AFA" stop-opacity="0"/></linearGradient><linearGradient id="iconGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#571EFA"/><stop offset="100%" stop-color="#927AFA"/></linearGradient><linearGradient id="shieldGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#571EFA"/><stop offset="100%" stop-color="#1a0a30"/></linearGradient><linearGradient id="heartGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#dc2626"/></linearGradient><filter id="glowWide" width="300%" height="300%" x="-100%" y="-100%"><feGaussianBlur in="SourceGraphic" stdDeviation="40"/></filter><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path fill="none" stroke="#571EFA" stroke-width="0.5" d="M 60 0 L 0 0 0 60" opacity="0.06"/></pattern><pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1" fill="#927AFA" opacity="0.12"/></pattern></defs><rect width="1200" height="630" fill="url(#bgGrad)"/><rect width="1200" height="630" fill="url(