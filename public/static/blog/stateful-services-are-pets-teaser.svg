    <tspan x="200" dy="0">Stateful Services Are Pets</tspan>
    <tspan x="200" fill="#DDD6FE" dy="38" font-size="22" font-weight="400">why your app deploy must never touch the database</tspan>
  </text><text x="200" y="420" fill="#927AFA" font-family="Arial, Helvetica, sans-serif" font-size="15" opacity="0.8">
    <tspan x="200" dy="0">One flag -- no-deps -- kept a routine deploy from</tspan>
    <tspan x="200" dy="22">recreating Dgraph and SIGKILLing production.</tspan>
  </text><g transform="translate(200, 480)"><rect width="80" height="24" x="0" y="0" fill="#571EFA" opacity="0.2" rx="12"/><text x="40" y="16" fill="#927AFA" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle">dgraph</text><rect width="90" height="24" x="90" y="0" fill="#571EFA" opacity="0.15" rx="12"/><text x="135" y="16" fill="#927AFA" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle">postgres</text><rect width="105" height="24" x="190" y="0" fill="#571EFA" opacity="0.15" rx="12"/><text x="242" y="16" fill="#927AFA" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle">--no-deps</text><rect width="85" height="24" x="305" y="0" fill="#571EFA" opacity="0.15" rx="12"/><text x="347" y="16" fill="#927AFA" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle">cattle</text><rect width="70" height="24" x="400" y="0" fill="#571EFA" opacity="0.15" rx="12"/><text x="435" y="16" fill="#927AFA" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle">pets</text></g><g opacity="0.06"><circle cx="190" cy="546" r="5" fill="#571EFA"/><circle cx="208" cy="546" r="5" fill="#927AFA"/><path stroke="#927AFA" stroke-width="1" d="M 218,546 L 250,546"/><circle cx="260" cy="546" r="5" fill="#571EFA"/><circle cx="278" cy="546" r="5" fill="#927AFA"/><path stroke="#927AFA" stroke-width="1" d="M 288,546 L 310,546"/><circle cx="320" cy="546" r="5" fill="#571EFA"/></g><line x1="1000" x2="1000" y1="100" y2="530" stroke="#571EFA" stroke-width="0.5" opacity="0.06"/><line x1="1050" x2="1050" y1="150" y2="500" stroke="#927AFA" stroke-width="0.5" opacity="0.05"/><line x1="1100" x2="1100" y1="120" y2="480" stroke="#571EFA" stroke-width="0.5" opacity="0.04"/><path fill="none" stroke="#571EFA" stroke-width="1.5" d="M 20,20 L 50,20 M 20,20 L 20,50" opacity="0.25"/><path fill="none" stroke="#