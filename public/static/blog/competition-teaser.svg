<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>openDesk Edu beim Open-Source-Wettbewerb 2026</title>
  <desc>Branded teaser image for the openDesk Edu nomination in the Open Source competition 2026, featuring a dark purple gradient background, a voting-check badge with podium bars, and the article title.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="50%" stop-color="#0d0020"/>
      <stop offset="100%" stop-color="#0a0014"/>
    </linearGradient>
    <linearGradient id="accentLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#571EFA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#571EFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#927AFA" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#927AFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#571EFA"/>
      <stop offset="100%" stop-color="#927AFA"/>
    </linearGradient>
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glowWide" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#571EFA" stroke-width="0.5" opacity="0.06"/>
    </pattern>
    <pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#927AFA" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#dotGrid)"/>

  <!-- Edge accents -->
  <rect x="0" y="0" width="200" height="630" fill="url(#accentLeft)"/>
  <rect x="1000" y="0" width="200" height="630" fill="url(#accentRight)"/>
  <rect x="0" y="0" width="1200" height="2" fill="#571EFA" opacity="0.4"/>
  <rect x="0" y="628" width="1200" height="2" fill="#927AFA" opacity="0.2"/>

  <!-- Ambient glow -->
  <ellipse cx="200" cy="315" rx="250" ry="250" fill="#571EFA" opacity="0.06" filter="url(#glowWide)"/>
  <ellipse cx="990" cy="300" rx="230" ry="230" fill="#22c55e" opacity="0.05" filter="url(#glowWide)"/>

  <!-- Podium / competition bars (decorative, right side behind the vote badge) -->
  <g opacity="0.14">
    <rect x="840" y="430" width="34" height="120" rx="6" fill="#571EFA"/>
    <rect x="888" y="382" width="34" height="168" rx="6" fill="#927AFA"/>
    <rect x="936" y="330" width="34" height="220" rx="6" fill="#22c55e"/>
    <path d="M 985,440 L 990,430 M 990,440 L 995,430" stroke="#927AFA" stroke-width="3" stroke-linecap="round"/>
    <path d="M 1005,400 L 1010,390 M 1010,400 L 1015,390" stroke="#927AFA" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Vote check badge (focal point near golden section, right-of-center) -->
  <g>
    <circle cx="1000" cy="300" r="86" fill="none" stroke="#927AFA" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle cx="1000" cy="300" r="66" fill="url(#iconGrad)" opacity="0.95"/>
    <path d="M 972,300 L 994,322 L 1030,278" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <circle cx="1000" cy="300" r="80" fill="none" stroke="#22c55e" stroke-opacity="0.5" stroke-width="2"/>
  </g>

  <!-- D Icon (brand) -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="110" height="110" rx="22" fill="url(#iconGrad)" opacity="0.9"/>
    <text x="55" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="bold" fill="white" opacity="0.95">D</text>
  </g>

  <!-- Brand wordmark -->
  <text x="200" y="194" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="white" letter-spacing="2">openDesk</text>
  <text x="200" y="222" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="300" fill="#DDD6FE" letter-spacing="10">EDUCATION</text>
  <line x1="200" y1="236" x2="380" y2="236" stroke="#571EFA" stroke-width="1" opacity="0.4"/>

  <!-- Article category badge -->
  <rect x="200" y="260" width="150" height="28" rx="14" fill="#571EFA" opacity="0.25"/>
  <text x="275" y="279" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#927AFA" letter-spacing="1">COMMUNITY</text>

  <!-- Decorative line -->
  <line x1="200" y1="312" x2="760" y2="312" stroke="#571EFA" stroke-width="1.5" opacity="0.2"/>

  <!-- Article title -->
  <text x="200" y="345" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="white">
    <tspan x="200" dy="0">openDesk Edu beim</tspan>
    <tspan x="200" dy="42" fill="#DDD6FE" font-weight="400">Open-Source-Wettbewerb 2026</tspan>
  </text>

  <!-- Short description -->
  <text x="200" y="440" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#927AFA" opacity="0.85">
    <tspan x="200" dy="0">Nominiert und community-getrieben — Ihre Stimme zählt</tspan>
    <tspan x="200" dy="22">für digitale Souveränität im Bildungsbereich.</tspan>
  </text>

  <!-- Tags -->
  <g transform="translate(200, 490)">
    <rect x="0" y="0" width="90" height="24" rx="12" fill="#571EFA" opacity="0.2"/>
    <text x="45" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#927AFA" font-weight="500">Nominiert</text>
    <rect x="100" y="0" width="90" height="24" rx="12" fill="#571EFA" opacity="0.15"/>
    <text x="145" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#927AFA" font-weight="500">Open Source</text>
    <rect x="200" y="0" width="100" height="24" rx="12" fill="#571EFA" opacity="0.15"/>
    <text x="250" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#927AFA" font-weight="500">Abstimmung</text>
    <rect x="310" y="0" width="85" height="24" rx="12" fill="#571EFA" opacity="0.15"/>
    <text x="352" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#927AFA" font-weight="500">Bildung</text>
  </g>

  <!-- Bottom decoration -->
  <g opacity="0.06">
    <rect x="180" y="560" width="12" height="12" rx="2" fill="#571EFA"/>
    <path d="M 196,566 L 210,566" stroke="#927AFA" stroke-width="1"/>
    <rect x="216" y="560" width="12" height="12" rx="2" fill="#22c55e"/>
    <path d="M 232,566 L 246,566" stroke="#927AFA" stroke-width="1"/>
    <rect x="252" y="560" width="12" height="12" rx="2" fill="#3b82f6"/>
  </g>

  <!-- Decorative vertical lines -->
  <line x1="1040" y1="100" x2="1040" y2="520" stroke="#571EFA" stroke-width="0.5" opacity="0.06"/>
  <line x1="1090" y1="150" x2="1090" y2="480" stroke="#927AFA" stroke-width="0.5" opacity="0.05"/>
  <line x1="1140" y1="120" x2="1140" y2="500" stroke="#571EFA" stroke-width="0.5" opacity="0.04"/>

  <!-- Corner marks -->
  <path d="M 20,20 L 50,20 M 20,20 L 20,50" stroke="#571EFA" stroke-width="1.5" opacity="0.25" fill="none"/>
  <path d="M 1180,20 L 1150,20 M 1180,20 L 1180,50" stroke="#927AFA" stroke-width="1.5" opacity="0.2" fill="none"/>
  <path d="M 20,610 L 50,610 M 20,610 L 20,580" stroke="#571EFA" stroke-width="1.5" opacity="0.25" fill="none"/>
  <path d="M 1180,610 L 1150,610 M 1180,610 L 1180,580" stroke="#927AFA" stroke-width="1.5" opacity="0.2" fill="none"/>
</svg>