<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>openDesk Edu - SCS vs. Proxmox + K3s</title>
  <desc>Branded teaser image for the SCS vs. Proxmox + K3s base-platform comparison article featuring a dark purple gradient background, cloud and server motif, grid pattern, and article title.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="50%" stop-color="#0d0020"/>
      <stop offset="100%" stop-color="#0a0014"/>
    </linearGradient>
    <linearGradient id="accentLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#571EFA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#571EFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#927AFA" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#927AFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#571EFA"/>
      <stop offset="100%" stop-color="#927AFA"/>
    </linearGradient>
    <filter id="glowWide" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#571EFA" stroke-width="0.5" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="400" height="630" fill="url(#accentLeft)"/>
  <rect x="800" y="0" width="400" height="630" fill="url(#accentRight)"/>

  <!-- Glow -->
  <circle cx="600" cy="315" r="320" fill="#571EFA" opacity="0.12" filter="url(#glowWide)"/>

  <!-- Header -->
  <text x="200" y="194" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="white" letter-spacing="2">openDesk</text>
  <text x="200" y="222" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="300" fill="#DDD6FE" letter-spacing="10">EDUCATION</text>
  <line x1="200" y1="248" x2="555" y2="248" stroke="#927AFA" stroke-width="1" opacity="0.4"/>

  <!-- Icons: SCS cloud (left) vs. Proxmox server + K3s node (right), VS in center -->
  <g transform="translate(760, 120)">
    <!-- SCS cloud -->
    <g transform="translate(0, 0)">
      <rect x="-40" y="-10" width="80" height="60" rx="8" fill="#571EFA" opacity="0.12"/>
      <path d="M -18,18 Q -22,-4 0,-6 Q 14,-10 22,2 Q 34,4 30,16 Q 26,24 12,24 L -12,24 Q -26,24 -18,18 Z" fill="none" stroke="#927AFA" stroke-width="2" opacity="0.9"/>
      <text x="0" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#DDD6FE" letter-spacing="1">SCS</text>
    </g>

    <!-- VS circle -->
    <circle cx="120" cy="20" r="28" fill="none" stroke="#571EFA" stroke-width="2.5" opacity="0.8"/>
    <text x="120" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#571EFA">VS</text>

    <!-- Proxmox server rack -->
    <g transform="translate(250, 0)">
      <rect x="-34" y="-12" width="68" height="64" rx="6" fill="#571EFA" opacity="0.12"/>
      <rect x="-26" y="-6" width="52" height="10" rx="2" fill="#927AFA" opacity="0.55"/>
      <rect x="-26" y="8" width="52" height="10" rx="2" fill="#927AFA" opacity="0.35"/>
      <rect x="-26" y="22" width="52" height="10" rx="2" fill="#927AFA" opacity="0.2"/>
      <circle cx="-14" cy="-1" r="2" fill="#22c55e"/>
      <text x="0" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#DDD6FE" letter-spacing="1">PROXMOX</text>
    </g>
  </g>

  <!-- K3s node dots (between icons and title) -->
  <g transform="translate(200, 300)">
    <circle cx="0" cy="0" r="5" fill="#571EFA" opacity="0.7"/>
    <circle cx="24" cy="0" r="5" fill="#927AFA" opacity="0.7"/>
    <circle cx="48" cy="0" r="5" fill="#571EFA" opacity="0.7"/>
    <text x="78" y="5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#DDD6FE">+ K3s</text>
  </g>

  <!-- Article title -->
  <text x="200" y="380" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" fill="white">SCS vs. Proxmox</text>
  <text x="200" y="428" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" fill="#DDD6FE">+ K3s</text>

  <!-- Subtitle -->
  <text x="200" y="472" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#DDD6FE" opacity="0.9">Choosing a Kubernetes Base for openDesk Edu</text>

  <!-- Tech tags -->
  <g transform="translate(200, 520)">
    <rect x="0" y="0" width="52" height="24" rx="12" fill="#571EFA" opacity="0.2"/>
    <text x="26" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#927AFA" font-weight="500">SCS</text>
    <rect x="62" y="0" width="86" height="24" rx="12" fill="#571EFA" opacity="0.15"/>
    <text x="105" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#927AFA" font-weight="500">Proxmox VE</text>
    <rect x="158" y="0" width="52" height="24" rx="12" fill="#571EFA" opacity="0.15"/>
    <text x="184" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#927AFA" font-weight="500">K3s</text>
    <rect x="220" y="0" width="92" height="24" rx="12" fill="#571EFA" opacity="0.15"/>
    <text x="266" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#927AFA" font-weight="500">Kubernetes</text>
    <rect x="322" y="0" width="96" height="24" rx="12" fill="#571EFA" opacity="0.15"/>
    <text x="370" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#927AFA" font-weight="500">Sovereignty</text>
  </g>

  <!-- Bottom decoration -->
  <g opacity="0.06">
    <rect x="180" y="575" width="16" height="16" rx="3" fill="#571EFA"/>
    <path d="M 185,579 L 185,577 Q 185,574 188,574 Q 191,574 191,577 L 191,579" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="188" cy="583" r="1.2" fill="white"/>
    <rect x="246" y="575" width="16" height="16" rx="3" fill="#22c55e"/>
    <path d="M 251,583 L 253.5,586 L 258,580" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 266,583 L 306,583" stroke="#927AFA" stroke-width="1"/>
    <rect x="312" y="575" width="16" height="16" rx="3" fill="#3b82f6"/>
  </g>

  <!-- Decorative vertical lines -->
  <line x1="1000" y1="100" x2="1000" y2="530" stroke="#571EFA" stroke-width="0.5" opacity="0.06"/>
  <line x1="1050" y1="150" x2="1050" y2="500" stroke="#927AFA" stroke-width="0.5" opacity="0.05"/>
  <line x1="1100" y1="120" x2="1100" y2="480" stroke="#571EFA" stroke-width="0.5" opacity="0.04"/>

  <!-- Corner marks -->
  <path d="M 20,20 L 50,20 M 20,20 L 20,50" stroke="#571EFA" stroke-width="1.5" opacity="0.25" fill="none"/>
  <path d="M 1180,20 L 1150,20 M 1180,20 L 1180,50" stroke="#927AFA" stroke-width="1.5" opacity="0.2" fill="none"/>
  <path d="M 20,610 L 50,610 M 20,610 L 20,580" stroke="#571EFA" stroke-width="1.5" opacity="0.25" fill="none"/>
  <path d="M 1180,610 L 1150,610 M 1180,610 L 1180,580" stroke="#927AFA" stroke-width="1.5" opacity="0.25" fill="none"/>
</svg>
