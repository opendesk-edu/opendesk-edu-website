se cx="200" cy="315" fill="#571EFA" filter="url(#glowWide)" opacity="0.06" rx="250" ry="250"/><ellipse cx="1000" cy="315" fill="#927AFA" filter="url(#glowWide)" opacity="0.04" rx="200" ry="200"/><g opacity="0.10" transform="translate(60, 100)"><rect width="90" height="90" x="0" y="0" fill="none" stroke="#927AFA" stroke-width="2" rx="8"/><rect width="60" height="60" x="15" y="15" fill="none" stroke="#927AFA" stroke-width="1.5" rx="4"/><line x1="20" x2="70" y1="30" y2="30" stroke="#927AFA" stroke-width="1.5"/><line x1="20" x2="70" y1="45" y2="45" stroke="#927AFA" stroke-width="1.5"/><line x1="20" x2="55" y1="60" y2="60" stroke="#927AFA" stroke-width="1.5"/><path stroke="#ef4444" stroke-linecap="round" stroke-width="2" d="M 70,70 L 85,55 M 70,65 L 80,55 M 70,75 L 90,65"/></g><g transform="translate(60, 130)"><rect width="110" height="110" x="0" y="0" fill="url(#iconGrad)" opacity="0.9" rx="22"/><text x="55" y="82" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="bold" opacity="0.95" text-anchor="middle">D</text></g><text x="200" y="194" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" letter-spacing="2">openDesk</text><text x="200" y="222" fill="#DDD6FE" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="300" letter-spacing="10">EDUCATION</text><line x1="200" x2="380" y1="236" y2="236" stroke="#571EFA" stroke-width="1" opacity="0.4"/><rect width="100" height="28" x="200" y="260" fill="#571EFA" opacity="0.25" rx="14"/><text x="250" y="279" fill="#927AFA" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="1" text-anchor="middle">OPINION</text><line x1="200" x2="950" y1="312" y2="312" stroke="#571EFA" stroke-width="1.5" opacity="0.2"/><text x="200" y="340" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">
    <tspan x="200" dy="0">The Microsoft 365 Trap:</tspan>
    <tspan x="200" fill="#DDD6FE" dy="38" font-size="22" font-weight="400">Why Short-Term Savings Lead to</tspan>
    <tspan x="200" fill="#DDD6FE" dy="28" font-size="22" font-weight="400">Long-Term Dependency for European</tspan>
    <tspan x="200" fill="#DDD6FE" dy="28" font-size="22" font-weight="400">Universities</tspan>
  </text><text x="200" y="455" fill="#927AFA" font-family="Arial, Helvetica, sans-serif" font-size="15" opacity="0.8">
