<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>openDesk Edu - SOPS Secret Management</title><desc>Branded teaser image for the openDesk Edu SOPS secret management article featuring a dark purple gradient background, encryption key icon, grid pattern, and article title.</desc><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0014"/><stop offset="50%" stop-color="#0d0020"/><stop offset="100%" stop-color="#0a0014"/></linearGradient><linearGradient id="keyGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#571EFA"/><stop offset="100%" stop-color="#927AFA"/></linearGradient><linearGradient id="accentLeft" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#571EFA" stop-opacity="0.3"/><stop offset="100%" stop-color="#571EFA" stop-opacity="0"/></linearGradient><linearGradient id="accentRight" x1="100%" x2="0%" y1="0%" y2="0%"><stop offset="0%" stop-color="#927AFA" stop-opacity="0.2"/><stop offset="100%" stop-color="#927AFA" stop-opacity="0"/></linearGradient><linearGradient id="iconGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#571EFA"/><stop offset="100%" stop-color="#927AFA"/></linearGradient><linearGradient id="lockGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#927AFA"/><stop offset="100%" stop-color="#571EFA"/></linearGradient><filter id="glowWide" width="300%" height="300%" x="-100%" y="-100%"><feGaussianBlur in="SourceGraphic" stdDeviation="40"/></filter><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path fill="none" stroke="#571EFA" stroke-width="0.5" d="M 60 0 L 0 0 0 60" opacity="0.06"/></pattern><pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1" fill="#927AFA" opacity="0.12"/></pattern></defs><rect width="1200" height="630" fill="url(#bgGrad)"/><rect width="1200" height="630" fill="url(#grid)"/><rect width="1200" height="630" fill="url(#dotGrid)"/><rect width="200" height="630" x="0" y="0" fill="url(#accentLeft)"/><rect width="200" height="630" x="1000" y="0" fill="url(#accentRight)"/><rect width="1200" height="2" x="0" y="0" fill="#571EFA" opacity="0.4"/><rect width="1200" height="2" x="0" y="628" fill="#927AFA" opacity="0.2"/><ellipse cx="200" cy="315" fill="#571EFA" filter="url(#glowWide)" opacity="0.06" rx="250" ry="250"/><ellipse cx="1000" cy="315" fill="#927AFA" filter="url(#glowWide)" opacity="0.04" rx="200" ry="200"/><g opacity="0.12" transform="translate(60, 100)"><rect width="100" height="85" x="25" y="60" fill="url(#lockGrad)" rx="8"/><path fill="none" stroke="url(#keyGrad)" stroke-linecap="round" stroke-width="8" d="M 40,60 L 40,40 Q 40,15 75,15 Q 110,15 110,40 L 110,60"/><circle cx="75" cy="100" r="12" fill="#0a0014"/><rect width="6" height="20" x="72" y="105" fill="#0a0014" rx="3"/></g><g transform="translate(60, 130)"><rect width="110" height="110" x="0" y="0" fill="url(#iconGrad)" opacity="0.9" rx="22"/><text x="55" y="82" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="bold" opacity="0.95" text-anchor="middle">D</text></g><text x="200" y="194" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" letter-spacing="2">openDesk</text><text x="200" y="222" fill="#DDD6FE" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="300" letter-spacing="10">EDUCATION</text><line x1="200" x2="380" y1="236" y2="236" stroke="#571EFA" stroke-width="1" opacity="0.4"/><rect width="160" height="28" x="200" y="260" fill="#571EFA" opacity="0.25" rx="14"/><text x="280" y="279" fill="#927AFA" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="1" text-anchor="middle">SECRET MANAGEMENT</text><line x1="200" x2="950" y1="312" y2="312" stroke="#571EFA" stroke-width="1.5" opacity="0.2"/><text x="200" y="340" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">
    <tspan x="200" dy="0">GitOps-Native Secret Management</tspan>
