<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>openDesk Edu - The Nix Shift</title><desc>Branded teaser image for the openDesk Edu Nix Shift article featuring a dark purple gradient background, a lambda/functional icon, grid pattern, and article title.</desc><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0014"/><stop offset="50%" stop-color="#0d0020"/><stop offset="100%" stop-color="#0a0014"/></linearGradient><linearGradient id="accentLeft" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#571EFA" stop-opacity="0.3"/><stop offset="100%" stop-color="#571EFA" stop-opacity="0"/></linearGradient><linearGradient id="accentRight" x1="100%" x2="0%" y1="0%" y2="0%"><stop offset="0%" stop-color="#927AFA" stop-opacity="0.2"/><stop offset="100%" stop-color="#927AFA" stop-opacity="0"/></linearGradient><linearGradient id="iconGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#571EFA"/><stop offset="100%" stop-color="#927AFA"/></linearGradient><linearGradient id="lambdaGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#927AFA"/><stop offset="100%" stop-color="#571EFA"/></linearGradient><filter id="glowWide" width="300%" height="300%" x="-100%" y="-100%"><feGaussianBlur in="SourceGraphic" stdDeviation="40"/></filter><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path fill="none" stroke="#571EFA" stroke-width="0.5" d="M 60 0 L 0 0 0 60" opacity="0.06"/></pattern><pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1" fill="#927AFA" opacity="0.12"/></pattern></defs><rect width="1200" height="630" fill="url(#bgGrad)"/><rect width="1200" height="630" fill="url(#grid)"/><rect width="1200" height="630" fill="url(#dotGrid)"/><rect width="200" height="630" x="0" y="0" fill="url(#accentLeft)"/><rect width="200" height="630" x="1000" y="0" fill="url(#accentRight)"/><rect width="1200" height="2" x="0" y="0" fill="#571EFA" opacity="0.4"/><rect width="1200" height="2" x="0" y="628" fill="#927AFA" opacity="0.2"/><ellipse cx="200" cy="315" fill="#571EFA" filter="url(#glowWide)" opacity="0.06" rx="250" ry="250"/><ellipse cx="1000" cy="315" fill="#927AFA" filter="url(#glowWide)" opacity="0.04" rx="200" ry="200"/><g transform="translate(60, 130)"><rect width="110" height="110" x="0" y="0" fill="url(#iconGrad)" opacity="0.9" rx="22"/><text x="55" y="82" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="bold" opacity="0.95" text-anchor="middle">λ</text></g><text x="200" y="194" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" letter-spacing="2">openDesk</text><text x="200" y="222" fill="#DDD6FE" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="300" letter-spacing="10">EDUCATION</text><line x1="200" x2="380" y1="236" y2="236" stroke="#571EFA" stroke-width="1" opacity="0.4"/><rect width="120" height="28" x="200" y="260" fill="#571EFA" opacity="0.25" rx="14"/><text x="260" y="279" fill="#927AFA" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="1" text-anchor="middle">ENGINEERING</text><line x1="200" x2="950" y1="312" y2="312" stroke="#571EFA" stroke-width="1.5" opacity="0.2"/><text x="200" y="340" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">
    <tspan x="200" dy="0">The Nix Shift</tspan>
    <tspan x="200" fill="#DDD6FE" dy="38" font-size="22" font-weight="400">Replacing Helmfile with Pure Functions</tspan>
  </text><text x="200" y="420" fill="#927AFA" font-family="Arial, Helvetica, sans-serif" font-size="15" opacity="0.8">
    <tspan x="200" dy="0">Deterministic, cached, and composable Kubernetes</tspan>
    <tspan x="200" dy="22">deployments across 28 services.</tspan>
  </text><g transform="translate(200, 480)"><rect width="55" height="24" x="0" y="0" fill="#571EFA" opacity="0.2" rx="12"/><text x="27" y="16" fill="#927AFA" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Nix</text><rect width="110" height="24" x="65" y="0" fill="#571EFA" opacity="0.15" rx="12"/><text x="120" y="16" fill="#927AFA" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Kubernetes</text><rect width="85" height="24" x="185" y="0" fill="#571EFA" opacity="0.15" rx="12"/><text x="227" y="16" fill="#927AFA" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Helmfile</text><rect width="80" height="24" x="280" y="0" fill="#571EFA" opacity="0.15" rx="12"/><text x="320" y="16" fill="#927AFA" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle">DevOps</text><rect width="80" height="24" x="370" y="0" fill="#571EFA" opacity="0.15" rx="12"/><text x="410" y="16" fill="#927AFA" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle">GitOps</text></g><g font-family="monospace" font-size="13" opacity="0.12" transform="translate(820, 350)"><text x="0" y="0" fill="#927AFA">$ nix build .#moodle</text><text x="0" y="22" fill="#571EFA">  → evaluating</text><text x="0" y="44" fill="#571EFA">  → building</text><text x="0" y="66" fill="#22c55e">  → cached ✓</text><text x="0" y="88" fill="#927AFA">$ nix build .#ilias</text><text x="0" y="110" fill="#22c55e">  → cached ✓</text><text x="0" y="132" fill="#22c55e">  → done in 2.1s</text></g><g opacity="0.06"><rect width="12" height="12" x="180" y="540" fill="#571EFA" rx="2"/><path stroke="#927AFA" stroke-width="1" d="M 196,546 L 210,546"/><rect width="12" height="12" x="216" y="540" fill="#22c55e" rx="2"/><path stroke="#927AFA" stroke-width="1" d="M 232,546 L 246,546"/><rect width="12" height="12" x="252" y="540" fill="#3b82f6" rx="2"/></g><line x1="1000" x2="1000" y1="100" y2="530" stroke="#571EFA" stroke-width="0.5" opacity="0.06"/><line x1="1050" x2="1050" y1="150" y2="500" stroke="#927AFA" stroke-width="0.5" opacity="0.05"/><line x1="1100" x2="1100" y1="120" y2="480" stroke="#571EFA" stroke-width="0.5" opacity="0.04"/><path fill="none" stroke="#571EFA" stroke-width="1.5" d="M 20,20 L 50,20 M 20,20 L 20,50" opacity="0.25"/><path fill="none" stroke="#927AFA" stroke-width="1.5" d="M 1180,20 L 1150,20 M 1180,20 L 1180,50" opacity="0.2"/><path fill="none" stroke="#571EFA" stroke-width="1.5" d="M 20,610 L 50,610 M 20,610 L 20,580" opacity="0.25"/><path fill="none" stroke="#927AFA" stroke-width="1.5" d="M 1180,610 L 1150,610 M 1180,610 L 1180,580" opacity="0.2"/></svg>