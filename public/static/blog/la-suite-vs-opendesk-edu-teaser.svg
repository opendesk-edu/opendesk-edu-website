<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>openDesk Edu - La Suite vs. openDesk Edu</title>
  <desc>Branded teaser image for the La Suite vs. openDesk Edu comparison article featuring a dark purple gradient background, French and German flags motif, grid pattern, and article title.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="50%" stop-color="#0d0020"/>
      <stop offset="100%" stop-color="#0a0014"/>
    </linearGradient>
    <linearGradient id="accentLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#571EFA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#571EFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#927AFA" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#927AFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#571EFA"/>
      <stop offset="100%" stop-color="#927AFA"/>
    </linearGradient>
    <linearGradient id="flagBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0055A4"/>
      <stop offset="100%" stop-color="#003D7A"/>
    </linearGradient>
    <linearGradient id="flagBlack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="flagRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4135"/>
      <stop offset="100%" stop-color="#C2291F"/>
    </linearGradient>
    <linearGradient id="flagGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFCE00"/>
      <stop offset="100%" stop-color="#E6B800"/>
    </linearGradient>
    <filter id="glowWide" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#571EFA" stroke-width="0.5" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="400" height="630" fill="url(#accentLeft)"/>
  <rect x="800" y="0" width="400" height="630" fill="url(#accentRight)"/>

  <!-- Glow -->
  <circle cx="600" cy="315" r="320" fill="#571EFA" opacity="0.12" filter="url(#glowWide)"/>

  <!-- Header -->
  <text x="55" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="bold" fill="white" opacity="0.95">🇫🇷</text>
  <text x="200" y="194" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="white" letter-spacing="2">openDesk</text>
  <text x="200" y="222" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="300" fill="#DDD6FE" letter-spacing="10">EDUCATION</text>
  <line x1="200" y1="248" x2="555" y2="248" stroke="#927AFA" stroke-width="1" opacity="0.4"/>

  <!-- Flag icons: France (left) and Germany (right) with VS in center -->
  <g transform="translate(750, 110)">
    <!-- France flag -->
    <rect x="0" y="0" width="40" height="60" fill="url(#flagBlue)" rx="2"/>
    <rect x="40" y="0" width="40" height="60" fill="white" rx="0"/>
    <rect x="80" y="0" width="40" height="60" fill="url(#flagRed)" rx="2"/>
    <rect x="0" y="0" width="120" height="60" fill="none" stroke="#927AFA" stroke-width="1.5" opacity="0.6" rx="3"/>

    <!-- VS circle -->
    <circle cx="170" cy="30" r="28" fill="none" stroke="#571EFA" stroke-width="2.5" opacity="0.8"/>
    <text x="170" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#571EFA">VS</text>

    <!-- Germany flag -->
    <rect x="220" y="0" width="40" height="20" fill="url(#flagBlack)" rx="2"/>
    <rect x="220" y="20" width="40" height="20" fill="url(#flagRed)"/>
    <rect x="220" y="40" width="40" height="20" fill="url(#flagGold)" rx="2"/>
    <rect x="220" y="0" width="40" height="60" fill="none" stroke="#927AFA" stroke-width="1.5" opacity="0.6" rx="3"/>
  </g>

  <!-- Article title -->
  <text x="200" y="310" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" fill="white">La Suite vs.</text>
  <text x="200" y="358" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" fill="#DDD6FE">openDesk Edu</text>

  <!-- Subtitle -->
  <text x="200" y="410" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#DDD6FE" opacity="0.9">France &amp; Germany: Sovereignty in Common — Architecture Apart</text>

  <!-- Tech tags -->
  <g transform="translate(200, 470)">
    <rect x="0" y="0" width="70" height="24" rx="12" fill="#571EFA" opacity="0.2"/>
    <text x="35" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#927AFA" font-weight="500">DINUM</text>
    <rect x="80" y="0" width="65" height="24" rx="12" fill="#571EFA" opacity="0.15"/>
    <text x="112" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#927AFA" font-weight="500">openDesk</text>
    <rect x="155" y="0" width="90" height="24" rx="12" fill="#571EFA" opacity="0.15"/>
    <text x="200" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#927AFA" font-weight="500">Sovereignty</text>
    <rect x="255" y="0" width="80" height="24" rx="12" fill="#571EFA" opacity="0.15"/>
    <text x="295" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#927AFA" font-weight="500">Open Source</text>
    <rect x="345" y="0" width="100" height="24" rx="12" fill="#571EFA" opacity="0.15"/>
    <text x="395" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#927AFA" font-weight="500">European Collab</text>
  </g>

  <!-- Bottom decoration -->
  <g opacity="0.06">
    <rect x="180" y="540" width="16" height="16" rx="3" fill="#571EFA"/>
    <path d="M 185,544 L 185,542 Q 185,539 188,539 Q 191,539 191,542 L 191,544" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="188" cy="548" r="1.2" fill="white"/>
    <rect x="246" y="540" width="16" height="16" rx="3" fill="#22c55e"/>
    <path d="M 251,548 L 253.5,551 L 258,545" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 266,548 L 306,548" stroke="#927AFA" stroke-width="1"/>
    <rect x="312" y="540" width="16" height="16" rx="3" fill="#3b82f6"/>
  </g>

  <!-- Decorative vertical lines -->
  <line x1="1000" y1="100" x2="1000" y2="530" stroke="#571EFA" stroke-width="0.5" opacity="0.06"/>
  <line x1="1050" y1="150" x2="1050" y2="500" stroke="#927AFA" stroke-width="0.5" opacity="0.05"/>
  <line x1="1100" y1="120" x2="1100" y2="480" stroke="#571EFA" stroke-width="0.5" opacity="0.04"/>

  <!-- Corner marks -->
  <path d="M 20,20 L 50,20 M 20,20 L 20,50" stroke="#571EFA" stroke-width="1.5" opacity="0.25" fill="none"/>
  <path d="M 1180,20 L 1150,20 M 1180,20 L 1180,50" stroke="#927AFA" stroke-width="1.5" opacity="0.2" fill="none"/>
  <path d="M 20,610 L 50,610 M 20,610 L 20,580" stroke="#571EFA" stroke-width="1.5" opacity="0.25" fill="none"/>
  <path d="M 1180,610 L 1150,610 M 1180,610 L 1180,580" stroke="#927AFA" stroke-width="1.5" opacity="0.2" fill="none"/>
</svg>
