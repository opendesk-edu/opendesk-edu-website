<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>openDesk Edu - Backup &amp; Restore</title>
  <desc>Branded teaser image for the openDesk Edu backup &amp; restore article featuring a dark purple gradient background, shield/database restore icon, grid pattern, and article title.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="50%" stop-color="#0d0020"/>
      <stop offset="100%" stop-color="#0a0014"/>
    </linearGradient>
    <linearGradient id="accentLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#571EFA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#571EFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#927AFA" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#927AFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#571EFA"/>
      <stop offset="100%" stop-color="#927AFA"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#571EFA"/>
      <stop offset="100%" stop-color="#2B0A5E"/>
    </linearGradient>
    <filter id="glowWide" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#571EFA" stroke-width="0.5" opacity="0.06"/>
    </pattern>
    <pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#927AFA" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#dotGrid)"/>

  <!-- Edge accents -->
  <rect x="0" y="0" width="200" height="630" fill="url(#accentLeft)"/>
  <rect x="1000" y="0" width="200" height="630" fill="url(#accentRight)"/>
  <rect x="0" y="0" width="1200" height="2" fill="#571EFA" opacity="0.4"/>
  <rect x="0" y="628" width="1200" height="2" fill="#927AFA" opacity="0.2"/>

  <!-- Ambient glow -->
  <ellipse cx="200" cy="315" rx="250" ry="250" fill="#571EFA" opacity="0.06" filter="url(#glowWide)"/>
  <ellipse cx="1000" cy="315" rx="200" ry="200" fill="#927AFA" opacity="0.04" filter="url(#glowWide)"/>

  <!-- Background storage/backup decoration -->
  <g transform="translate(30, 70)" opacity="0.10">
    <!-- Database cylinders -->
    <ellipse cx="80" cy="30" rx="34" ry="9" fill="none" stroke="#927AFA" stroke-width="1.2"/>
    <path d="M 48,30 L 48,56 M 112,30 L 112,56" stroke="#927AFA" stroke-width="1.2" fill="none"/>
    <path d="M 48,56 A 34 9 0 0 0 112 56" fill="none" stroke="#927AFA" stroke-width="1.2"/>
    <ellipse cx="80" cy="56" rx="34" ry="9" fill="none" stroke="#571EFA" stroke-width="1.2"/>
    <ellipse cx="80" cy="80" rx="34" ry="9" fill="none" stroke="#927AFA" stroke-width="1.2"/>
    <path d="M 48,56 L 48,80 M 112,56 L 112,80" stroke="#927AFA" stroke-width="1" fill="none"/>
    <path d="M 48,80 A 34 9 0 0 0 112 80" fill="none" stroke="#927AFA" stroke-width="1.2"/>
    <!-- Restore arrow between nodes -->
    <path d="M 140,40 A 28 28 0 1 1 130,66" fill="none" stroke="#571EFA" stroke-width="2"/>
    <polygon points="130,66 124,54 137,58" fill="#571EFA"/>
    <!-- Backup chevrons -->
    <path d="M 190,40 L 210,40 M 200,28 L 200,52" stroke="#571EFA" stroke-width="2" fill="none"/>
    <path d="M 190,64 L 210,64 M 200,52 L 200,76" stroke="#571EFA" stroke-width="2" fill="none"/>
  </g>

  <!-- Shield with restore/storage icon -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="110" height="110" rx="22" fill="url(#iconGrad)" opacity="0.95"/>
    <!-- Shield -->
    <path d="M 55,18 L 86,30 L 86,58 C 86,78 72,88 55,94 C 38,88 24,78 24,58 L 24,30 Z" fill="url(#shieldGrad)" stroke="white" stroke-width="2.5" opacity="0.95"/>
    <!-- Database cylinder inside shield -->
    <ellipse cx="55" cy="46" rx="16" ry="4.5" fill="none" stroke="white" stroke-width="1.8"/>
    <path d="M 39,46 L 39,62 M 71,46 L 71,62" stroke="white" stroke-width="1.8" fill="none"/>
    <path d="M 39,62 A 16 4.5 0 0 0 71 62" fill="none" stroke="white" stroke-width="1.8"/>
    <!-- Restore arrow -->
    <path d="M 55,66 C 40,66 34,54 41,44" fill="none" stroke="#927AFA" stroke-width="2.4"/>
    <polygon points="41,44 48,46 40,50" fill="#927AFA"/>
    <path d="M 55,66 L 70,66 C 74,66 78,62 78,58" fill="none" stroke="white" stroke-width="2"/>
  </g>

  <!-- Brand wordmark -->
  <text x="200" y="194" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="white" letter-spacing="2">openDesk</text>
  <text x="200" y="222" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="300" fill="#DDD6FE" letter-spacing="10">EDUCATION</text>
  <line x1="200" y1="236" x2="380" y2="236" stroke="#571EFA" stroke-width="1" opacity="0.4"/>

  <!-- Article category badge -->
  <rect x="200" y="260" width="140" height="28" rx="14" fill="#571EFA" opacity="0.25"/>
  <text x="270" y="279" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#927AFA" letter-spacing="1">OPERATIONS</text>

  <!-- Decorative line -->
  <line x1="200" y1="312" x2="950" y2="312" stroke="#571EFA" stroke-width="1.5" opacity="0.2"/>

  <!-- Article title -->
  <text x="200" y="340" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="white">
    <tspan x="200" dy="0">Backup &amp; Restore</tspan>
    <tspan x="200" dy="38" fill="#DDD6FE" font-weight="400" font-size="22">The 3-Tier Approach to Data Sovereignty</tspan>
  </text>

  <!-- Short description -->
  <text x="200" y="420" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#927AFA" opacity="0.8">
    <tspan x="200" dy="0">k8up, Restic &amp; S3: verified restores with clear</tspan>
    <tspan x="200" dy="22">RPO, RTO and retention — and an honest gap analysis.</tspan>
  </text>

  <!-- Tech tags -->
  <g transform="translate(200, 480)">
    <rect x="0" y="0" width="70" height="24" rx="12" fill="#571EFA" opacity="0.2"/>
    <text x="35" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#927AFA" font-weight="500">k8up</text>
    <rect x="80" y="0" width="75" height="24" rx="12" fill="#571EFA" opacity="0.15"/>
    <text x="117" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#927AFA" font-weight="500">Restic</text>
    <rect x="165" y="0" width="55" height="24" rx="12" fill="#571EFA" opacity="0.15"/>
    <text x="192" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#927AFA" font-weight="500">S3</text>
    <rect x="230" y="0" width="95" height="24" rx="12" fill="#571EFA" opacity="0.15"/>
    <text x="277" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#927AFA" font-weight="500">Ceph</text>
    <rect x="335" y="0" width="130" height="24" rx="12" fill="#571EFA" opacity="0.15"/>
    <text x="400" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#927AFA" font-weight="500">3-Tier</text>
  </g>

  <!-- Bottom decoration -->
  <g opacity="0.06">
    <circle cx="190" cy="546" r="5" fill="#571EFA"/>
    <circle cx="208" cy="546" r="5" fill="#927AFA"/>
    <path d="M 218,546 L 250,546" stroke="#927AFA" stroke-width="1"/>
    <circle cx="260" cy="546" r="5" fill="#571EFA"/>
    <circle cx="278" cy="546" r="5" fill="#927AFA"/>
    <path d="M 288,546 L 310,546" stroke="#927AFA" stroke-width="1"/>
    <circle cx="320" cy="546" r="5" fill="#571EFA"/>
  </g>

  <!-- Decorative vertical lines -->
  <line x1="1000" y1="100" x2="1000" y2="530" stroke="#571EFA" stroke-width="0.5" opacity="0.06"/>
  <line x1="1050" y1="150" x2="1050" y2="500" stroke="#927AFA" stroke-width="0.5" opacity="0.05"/>
  <line x1="1100" y1="120" x2="1100" y2="480" stroke="#571EFA" stroke-width="0.5" opacity="0.04"/>

  <!-- Corner marks -->
  <path d="M 20,20 L 50,20 M 20,20 L 20,50" stroke="#571EFA" stroke-width="1.5" opacity="0.25" fill="none"/>
  <path d="M 1180,20 L 1150,20 M 1180,20 L 1180,50" stroke="#927AFA" stroke-width="1.5" opacity="0.2" fill="none"/>
  <path d="M 20,610 L 50,610 M 20,610 L 20,580" stroke="#571EFA" stroke-width="1.5" opacity="0.25" fill="none"/>
  <path d="M 1180,610 L 1150,610 M 1180,610 L 1180,580" stroke="#927AFA" stroke-width="1.5" opacity="0.2" fill="none"/>
</svg>
