<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="50%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#1a1033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Glow circles -->
  <circle cx="200" cy="200" r="250" fill="#a855f7" opacity="0.06"/>
  <circle cx="1000" cy="450" r="200" fill="#ec4899" opacity="0.05"/>

  <!-- Left bar -->
  <rect x="80" y="160" width="6" height="310" rx="3" fill="url(#accent)" opacity="0.4"/>

  <!-- Title block -->
  <text x="120" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Sovereign Student Email
  </text>

  <text x="120" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#c4b5fd" font-weight="500" letter-spacing="0.5">
    A Federal Architecture for German Higher Education
  </text>

  <!-- Divider -->
  <rect x="120" y="305" width="80" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Subtitle -->
  <text x="120" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#a1a1aa" font-weight="400">
    One instance per Bundesland. University autonomy preserved. Federation via open standards.
  </text>

  <!-- Stats bar at bottom -->
  <rect x="80" y="490" width="1040" height="90" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Stat 1 -->
  <text x="200" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#a855f7" text-anchor="middle">2.8 M</text>
  <text x="200" y="555" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#71717a" text-anchor="middle">students</text>

  <!-- Divider -->
  <line x1="420" y1="510" x2="420" y2="565" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Stat 2 -->
  <text x="600" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#a855f7" text-anchor="middle">13</text>
  <text x="600" y="555" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#71717a" text-anchor="middle">federal instances</text>

  <!-- Divider -->
  <line x1="780" y1="510" x2="780" y2="565" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Stat 3 -->
  <text x="960" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#ec4899" text-anchor="middle">AGPL-3.0</text>
  <text x="960" y="555" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#71717a" text-anchor="middle">open source</text>
</svg>
