<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>openDesk Edu — Security Architecture</title>
  <desc>Branded teaser image for the openDesk Edu Security Architecture article. Dark purple gradient background with a security shield icon, grid pattern, and article title.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="50%" stop-color="#0d0020"/>
      <stop offset="100%" stop-color="#0a0014"/>
    </linearGradient>
    <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#571EFA"/>
      <stop offset="100%" stop-color="#927AFA"/>
    </linearGradient>
    <linearGradient id="accentLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#571EFA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#571EFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#927AFA" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#927AFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#571EFA"/>
      <stop offset="100%" stop-color="#927AFA"/>
    </linearGradient>
    <filter id="glowWide" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#571EFA" stroke-width="0.5" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left accent glow -->
  <ellipse cx="200" cy="315" rx="300" ry="400" fill="url(#accentLeft)"/>
  <!-- Right accent glow -->
  <ellipse cx="1000" cy="315" rx="300" ry="400" fill="url(#accentRight)"/>

  <!-- Security icon: shield with lock + compliance layers -->
  <g transform="translate(190, 195)">
    <!-- Glow behind icon -->
    <circle cx="100" cy="120" r="90" fill="url(#iconGrad)" opacity="0.15" filter="url(#glowWide)"/>

    <!-- Outer shield -->
    <path d="M 100 30 L 145 50 L 145 100 Q 145 135 100 155 Q 55 135 55 100 L 55 50 Z"
          fill="none" stroke="url(#secGrad)" stroke-width="3" opacity="0.8"/>

    <!-- Inner shield -->
    <path d="M 100 45 L 135 60 L 135 100 Q 135 128 100 145 Q 65 128 65 100 L 65 60 Z"
          fill="url(#secGrad)" opacity="0.15"/>

    <!-- Lock body -->
    <rect x="85" y="90" width="30" height="25" rx="4" fill="url(#secGrad)" opacity="0.9"/>
    <!-- Lock shackle -->
    <path d="M 90 90 L 90 80 Q 90 70 100 70 Q 110 70 110 80 L 110 90"
          fill="none" stroke="url(#secGrad)" stroke-width="3" opacity="0.9"/>
    <!-- Keyhole -->
    <circle cx="100" cy="100" r="4" fill="#0a0014" opacity="0.8"/>
    <rect x="98" y="100" width="4" height="8" rx="1" fill="#0a0014" opacity="0.8"/>

    <!-- Compliance checkmark below shield -->
    <g stroke="url(#secGrad)" stroke-width="2.5" fill="none" opacity="0.7">
      <path d="M 75 180 L 95 200 L 130 165"/>
    </g>
  </g>

  <!-- Title text -->
  <text x="580" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#ffffff" text-anchor="start" letter-spacing="-0.5">
    Security Architecture
  </text>
  <text x="580" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="url(#secGrad)" text-anchor="start" letter-spacing="-0.5">
    Secrets · RBAC · Network · Compliance
  </text>

  <!-- Subtitle -->
  <text x="580" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#a0a0c0" text-anchor="start">
    SOPS · Network Policies · Audit Logging · BSI · GDPR · ISO 27001
  </text>

  <!-- Bottom accent line -->
  <rect x="580" y="390" width="340" height="3" rx="1.5" fill="url(#secGrad)" opacity="0.6"/>

  <!-- openDesk Edu branding -->
  <text x="580" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#666680" text-anchor="start">
    openDesk Edu · Architecture Reference
  </text>
</svg>
