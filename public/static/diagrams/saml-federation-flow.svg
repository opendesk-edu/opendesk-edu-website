    .s{rx:6;stroke-width:1.5}</style><rect width="1200" height="400" fill="#FAFBFC"/><text x="30" y="20" class="g">SAML Federation Flow</text><rect width="180" height="40" x="30" y="32" fill="#EFF6FF" stroke="#2563EB" class="s" rx="20"/><text x="120" y="52" fill="#2563EB" class="n">University IdP</text><text x="120" y="62" fill="#93C5FD" class="n" font-size="9">(DFN-AAI)</text><line x1="210" x2="245" y1="52" y2="52" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ab)"/><text x="228" y="45" fill="#2563EB" font-size="8">SAML</text><rect width="180" height="40" x="250" y="32" fill="#EFF6FF" stroke="#2563EB" class="s" rx="20"/><text x="340" y="52" fill="#2563EB" class="n">Keycloak Broker</text><text x="340" y="62" fill="#93C5FD" class="n" font-size="9">(SAML→OIDC)</text><line x1="430" x2="465" y1="52" y2="52" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ab)"/><text x="448" y="45" fill="#2563EB" font-size="8">OIDC</text><rect width="180" height="40" x="470" y="32" fill="#EFF6FF" stroke="#2563EB" class="s" rx="20"/><text x="560" y="52" fill="#2563EB" class="n">openDesk Services</text><text x="560" y="62" fill="#93C5FD" class="n" font-size="9">(ILIAS, Moodle, BBB...)</text><rect width="620" height="100" x="30" y="100" fill="#F5F3FF" stroke="#E9E5F5" rx="10"/><text x="50" y="118" fill="#7C3AED" class="g">Attribute Mapping</text><rect width="150" height="24" x="45" y="128" fill="#fff" stroke="#571EFA" class="s" rx="4"/><text x="120" y="145" fill="#7C3AED" class="n">eduPersonAffiliation → roles</text><rect width="150" height="24" x="210" y="128" fill="#fff" stroke="#571EFA" class="s" rx="4"/><text x="285" y="145" fill="#7C3AED" class="n">mail → email</text><rect width="150" height="24" x="375" y="128" fill="#fff" stroke="#571EFA" class="s" rx="4"/><text x="450" y="145" fill="#7C3AED" class="n">displayName → displayName</text><rect width="150" height="24" x="45" y="164" fill="#fff" stroke="#571EFA" class="s" rx="4"/><text x="120" y="181" fill="#7C3AED" class="n">c